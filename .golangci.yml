run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable-all: true
  disable:
    - gochecknoglobals
    - gochecknoinits
    - wsl
    - depguard
    - exhaustruct
    - forbidigo
    - funlen
    - gocognit
    - godox
    - goerr113
    - ireturn
    - lll
    - maintidx
    - nestif
    - nlreturn
    - noctx
    - paralleltest
    - testpackage
    - varnamelen
    - wrapcheck

linters-settings:
  govet:
    check-shadowing: true
  staticcheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 100
  goconst:
    min-len: 2
    min-occurrences: 2
  misspell:
    locale: US
  unparam:
    check-exported: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - staticcheck
    - path: vendor
      linters:
        - all